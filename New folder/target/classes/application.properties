spring.application.name=my-api-project
server.port=8080
server.servlet.context-path=/api

# ========== Alpaca Trading Bot Configuration ==========
# Get your API keys from https://app.alpaca.markets/paper/dashboard/home
# Paper Trading API: https://paper-api.alpaca.markets (simulated trading, no real money)
# Live Trading API: https://api.alpaca.markets (real money - be careful!)

# Replace with your own API keys
alpaca.api-key=YOUR_ALPACA_API_KEY_HERE
alpaca.secret-key=YOUR_ALPACA_SECRET_KEY_HERE
alpaca.base-url=https://paper-api.alpaca.markets
alpaca.data-url=https://data.alpaca.markets

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.api=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
